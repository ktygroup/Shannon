<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shannon | The Trust Layer</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800;900&display=swap');
        :root { --primary: #38bdf8; --dark: #0f172a; --card: #1e293b; --text: #f8fafc; --muted: #94a3b8; --border: #334155; --warning: #eab308; --success: #22c55e; --danger: #ef4444; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background: var(--dark); color: var(--text); line-height: 1.7; }
        nav { display: flex; justify-content: space-between; align-items: center; padding: 20px 40px; background: rgba(15, 23, 42, 0.95); position: sticky; top: 0; z-index: 100; border-bottom: 1px solid var(--border); }
        .logo { font-size: 1.5rem; font-weight: 900; color: var(--primary); cursor: pointer; letter-spacing: 2px; }
        .gear-icon { font-size: 1.8rem; cursor: pointer; user-select: none; }
        .drawer-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.6); z-index: 1000; opacity: 0; pointer-events: none; transition: opacity 0.3s; }
        .drawer-overlay.open { opacity: 1; pointer-events: auto; }
        .drawer { position: fixed; top: 0; right: -300px; width: 300px; height: 100vh; background: var(--card); z-index: 1001; transition: right 0.3s; padding: 30px; display: flex; flex-direction: column; gap: 15px; border-left: 1px solid var(--border); }
        .drawer.open { right: 0; }
        .drawer-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid var(--border); padding-bottom: 15px; }
        .drawer-header h3 { color: var(--primary); }
        .close-btn { cursor: pointer; font-size: 1.5rem; color: var(--muted); }
        .drawer-link { padding: 12px; background: rgba(255,255,255,0.03); border-radius: 8px; cursor: pointer; color: var(--text); font-weight: 600; }
        .page-container { max-width: 900px; margin: 0 auto; padding: 70px 20px; min-height: 80vh; }
        h1 { font-size: 3.5rem; font-weight: 900; line-height: 1.1; margin-bottom: 20px; }
        h1 span { color: var(--primary); }
        h2 { font-size: 2.2rem; margin-bottom: 20px; font-weight: 800; border-bottom: 2px solid var(--border); padding-bottom: 10px; display: inline-block; }
        h3 { font-size: 1.4rem; margin-bottom: 15px; color: var(--primary); font-weight: 600; }
        p { margin-bottom: 20px; color: #cbd5e1; font-size: 1.1rem; }
        .hook { font-size: 1.3rem; font-weight: 600; font-style: italic; margin-bottom: 40px; border-left: 4px solid var(--primary); padding: 15px 20px; background: linear-gradient(90deg, rgba(56,189,248,0.1) 0%, transparent 100%); }
        .card { background: var(--card); border-radius: 16px; padding: 40px; margin-bottom: 30px; border: 1px solid var(--border); }
        button { background: var(--primary); color: var(--dark); border: none; padding: 16px 32px; border-radius: 8px; font-weight: 800; font-size: 1rem; cursor: pointer; transition: all 0.2s; text-transform: uppercase; }
        button:hover { background: #7dd3fc; }
        button:disabled { background: #475569; color: var(--muted); cursor: not-allowed; }
        .btn-danger { background: var(--danger); color: white; }
        .btn-success { background: var(--success); color: white; }
        .btn-outline { background: transparent; border: 2px solid var(--primary); color: var(--primary); }
        input, textarea { width: 100%; padding: 16px; margin: 10px 0; border-radius: 8px; border: 1px solid var(--border); background: var(--dark); color: white; font-size: 1rem; }
        .wallet-box { background: var(--dark); border: 2px dashed var(--primary); padding: 25px; border-radius: 12px; text-align: center; margin: 25px 0; font-family: monospace; font-size: 1.2rem; color: var(--primary); font-weight: bold; }
        .user-row { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding: 20px 0; }
        .toggle-btn { padding: 10px 20px; font-size: 0.9rem; width: auto; }
        .certificate-box { position: relative; background: #0f172a; border: 2px solid var(--border); border-radius: 12px; padding: 30px; margin-top: 25px; overflow: hidden; }
        .certificate-box.sealed { border-color: var(--success); }
        .certificate-box.pending { border-color: var(--warning); }
        .certificate-box.denied { border-color: var(--danger); }
        .watermark { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) rotate(-25deg); font-size: 8rem; font-weight: 900; color: rgba(255, 255, 255, 0.03); pointer-events: none; z-index: 0; white-space: nowrap; }
        .cert-content { position: relative; z-index: 1; }
        .seal { display: inline-block; padding: 8px 16px; border-radius: 4px; font-size: 0.85rem; font-weight: 900; margin-bottom: 20px; text-transform: uppercase; }
        .seal.pending { background: var(--warning); color: #000; }
        .seal.sealed { background: var(--success); color: white; }
        .seal.denied { background: var(--danger); color: white; }
        @media (max-width: 768px) { h1 { font-size: 2.5rem; } .page-container { padding: 40px 20px; } .card { padding: 25px; } nav { padding: 15px 20px; } }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect } = React;
        const SUPABASE_URL = 'https://cpwfezdxdvuctacayjqh.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNwd2ZlemR4ZHZ1Y3RhY2F5anFoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI1OTY4MzgsImV4cCI6MjEwODE3MjgzOH0.2zMpGeU2as25QTpciIe_Ag5jYmVRsu8GdMLN7dajTmc';
        const TRUST_WALLET = '0x5Fc844C3D414d279d5251Ff372601547cB673d28';
        const OWNER_EMAIL = 'vision.ktygroup@gmail.com';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        function App() {
            const [session, setSession] = useState(null);
            const [currentPage, setCurrentPage] = useState('home'); 
            const [menuOpen, setMenuOpen] = useState(false);
            
            // Check URL for the magic sign link
            const urlParams = new URLSearchParams(window.location.search);
            const signId = urlParams.get('sign');

            useEffect(() => {
                supabase.auth.getSession().then(({ data: { session } }) => {
                    setSession(session); if(session) setCurrentPage('dashboard');
                });
                const { data: { subscription } } = supabase.auth.onAuthStateChange((_event, session) => {
                    setSession(session); if(session) setCurrentPage('dashboard'); else setCurrentPage('home');
                });
                return () => subscription.unsubscribe();
            }, []);

            const handleLogout = async () => { await supabase.auth.signOut(); setCurrentPage('home'); setMenuOpen(false); };
            const navigateTo = (page) => { setCurrentPage(page); setMenuOpen(false); window.scrollTo(0, 0); };

            // If the URL has ?sign=, show the signing page immediately
            if (signId) {
                if (!session) return <AuthPage onLogin={setSession} isSigning={true} signId={signId} />;
                return <SigningPage agreementId={signId} session={session} />;
            }

            const renderPage = () => {
                if (session) {
                    if (session.user.email === OWNER_EMAIL) return <OwnerPanel />;
                    return <UserDashboard session={session} />;
                }
                switch(currentPage) {
                    case 'home': return <HomePage navigateTo={navigateTo} />;
                    case 'about': return <AboutPage navigateTo={navigateTo} />;
                    case 'pricing': return <PricingPage navigateTo={navigateTo} />;
                    case 'contact': return <ContactPage />;
                    case 'auth': return <AuthPage onLogin={setSession} />;
                    default: return <HomePage navigateTo={navigateTo} />;
                }
            };

            return (
                <div>
                    <nav>
                        <div className="logo" onClick={() => navigateTo(session ? 'dashboard' : 'home')}>SHANNON</div>
                        <div className="gear-icon" onClick={() => setMenuOpen(true)}>⚙️</div>
                    </nav>
                    <div className={`drawer-overlay ${menuOpen ? 'open' : ''}`} onClick={() => setMenuOpen(false)}></div>
                    <div className={`drawer ${menuOpen ? 'open' : ''}`}>
                        <div className="drawer-header"><h3>Menu</h3><div className="close-btn" onClick={() => setMenuOpen(false)}>✕</div></div>
                        {!session ? (
                            <>
                                <div className="drawer-link" onClick={() => navigateTo('home')}>Home</div>
                                <div className="drawer-link" onClick={() => navigateTo('about')}>About</div>
                                <div className="drawer-link" onClick={() => navigateTo('pricing')}>Pricing</div>
                                <div className="drawer-link" onClick={() => navigateTo('contact')}>Contact</div>
                                <div className="drawer-link" style={{background: 'var(--primary)', color: 'var(--dark)', marginTop: 'auto', textAlign: 'center'}} onClick={() => navigateTo('auth')}>Sign In / Sign Up</div>
                            </>
                        ) : (
                            <>
                                <div className="drawer-link" onClick={() => navigateTo('dashboard')}>My Dashboard</div>
                                <div className="drawer-link" style={{background: '#ef4444', color: 'white', marginTop: 'auto', textAlign: 'center'}} onClick={handleLogout}>Log Out</div>
                            </>
                        )}
                    </div>
                    {renderPage()}
                </div>
            );
        }

        // --- PARTY B SIGNING PAGE (LOGIN REQUIRED) ---
        function SigningPage({ agreementId, session }) {
            const [agreement, setAgreement] = useState(null);
            const [loading, setLoading] = useState(true);
            const [error, setError] = useState('');

            useEffect(() => { fetchAgreement(); }, [agreementId]);

            const fetchAgreement = async () => {
                const { data, error } = await supabase.from('agreements').select('*').eq('id', agreementId).single();
                if (error || !data) {
                    setError('Agreement not found.');
                } else {
                    // SECURITY CHECK: Does the logged-in email match Party B's email?
                    if (data.party_b_wallet.toLowerCase() !== session.user.email.toLowerCase()) {
                        setError(`Access Denied. This agreement was sent to a different email address.`);
                    } else {
                        setAgreement(data);
                    }
                }
                setLoading(false);
            };

            const handleSign = async (decision) => {
                const { error } = await supabase.from('agreements')
                    .update({ party_b_status: decision, status: decision === 'accepted' ? 'sealed' : 'denied' })
                    .eq('id', agreement.id);
                
                if (error) alert("Error: " + error.message);
                else {
                    setAgreement({ ...agreement, party_b_status: decision, status: decision === 'accepted' ? 'sealed' : 'denied' });
                }
            };

            if (loading) return <div className="page-container"><h2>Loading Agreement...</h2></div>;
            if (error) return <div className="page-container"><h2 style={{color: 'var(--danger)'}}>{error}</h2></div>;

            return (
                <div className="page-container">
                    <h2>Review Agreement</h2>
                    <div className={`certificate-box ${agreement.status === 'sealed' ? 'sealed' : agreement.status === 'denied' ? 'denied' : 'pending'}`}>
                        <div className="watermark">SHANNON</div>
                        <div className="cert-content">
                            <span className={`seal ${agreement.status === 'sealed' ? 'sealed' : agreement.status === 'denied' ? 'denied' : 'pending'}`}>
                                {agreement.status === 'sealed' ? '🛡️ Agreement Sealed' : agreement.status === 'denied' ? '❌ Agreement Denied' : '⏳ Awaiting Your Decision'}
                            </span>
                            <p><strong>From:</strong> {agreement.party_a_wallet}</p>
                            <p><strong>Agreement:</strong> {agreement.agreement_text}</p>
                            
                            {agreement.status === 'pending' && (
                                <div style={{display: 'flex', gap: '10px', marginTop: '20px'}}>
                                    <button onClick={() => handleSign('accepted')} className="btn-success" style={{flex: 1}}>Accept & Sign</button>
                                    <button onClick={() => handleSign('denied')} className="btn-danger" style={{flex: 1}}>Deny</button>
                                </div>
                            )}
                            
                            {agreement.status === 'sealed' && <p style={{color: 'var(--success)', fontWeight: 'bold'}}>You have officially signed this agreement. Party A has been notified.</p>}
                            {agreement.status === 'denied' && <p style={{color: 'var(--danger)', fontWeight: 'bold'}}>You have rejected this agreement.</p>}
                            
                            <p style={{fontSize: '0.85rem', color: '#94a3b8', borderTop: '1px solid var(--border)', paddingTop: '15px', marginTop: '20px'}}>
                                <strong>Cryptographic Hash:</strong> {agreement.agreement_hash}
                            </p>
                        </div>
                    </div>
                </div>
            );
        }

        // --- PARTY A DASHBOARD ---
        function UserDashboard({ session }) {
            const [isActive, setIsActive] = useState(false);
            const [agreements, setAgreements] = useState([]);
            const [partyBEmail, setPartyBEmail] = useState('');
            const [text, setText] = useState('');
            const [submitting, setSubmitting] = useState(false);

            useEffect(() => {
                fetchUserStatus(); fetchAgreements();
            }, []);

            useEffect(() => {
                const interval = setInterval(() => { fetchAgreements(); }, 5000); // Auto-refresh
                return () => clearInterval(interval);
            }, []);

            const fetchUserStatus = async () => {
                const { data } = await supabase.from('users').select('is_active').eq('id', session.user.id).single();
                if (data) setIsActive(data.is_active);
            };

            const fetchAgreements = async () => {
                const { data } = await supabase.from('agreements').select('*').order('created_at', { ascending: false });
                if (data) setAgreements(data);
            };

            const createAgreement = async (e) => {
                e.preventDefault();
                if (!isActive) return alert("Your account is not active.");
                setSubmitting(true);
                
                const hash = btoa(text + Date.now()).substring(0, 16);
                const newId = crypto.randomUUID();

                const { error } = await supabase.from('agreements').insert({
                    id: newId,
                    party_a_wallet: session.user.email, 
                    party_b_wallet: partyBEmail, 
                    agreement_text: text,
                    agreement_hash: hash,
                    created_by: session.user.id,
                    status: 'pending',
                    party_b_status: 'pending'
                });

                if (error) alert(error.message);
                else { setText(''); setPartyBEmail(''); fetchAgreements(); }
                setSubmitting(false);
            };

            const sendWhatsApp = (id) => {
                const link = `${window.location.origin}/?sign=${id}`;
                const message = `Hi, I have sent you an agreement to sign on Shannon. Please click this secure link to review and accept: ${link}`;
                window.open(`https://wa.me/?text=${encodeURIComponent(message)}`, '_blank');
            };

            const copyLink = (id) => {
                navigator.clipboard.writeText(`${window.location.origin}/?sign=${id}`);
                alert("Link copied!");
            };

            return (
                <div className="page-container">
                    <h2>Welcome, {session.user.email}</h2>
                    
                    <div className="card">
                        <h3>Subscription Status</h3>
                        {isActive ? (
                            <p style={{color: 'var(--success)', fontWeight: 'bold', fontSize: '1.2rem'}}>✅ Active - Your trust layer is online.</p>
                        ) : (
                            <div>
                                <p style={{color: '#ef4444', fontWeight: 'bold', fontSize: '1.2rem'}}>🔒 Inactive - Payment Required.</p>
                                <p>Send <strong>$19.99/Month</strong> to:</p>
                                <div className="wallet-box">{TRUST_WALLET}</div>
                            </div>
                        )}
                    </div>

                    <div className="card">
                        <h3>Create New Agreement</h3>
                        <form onSubmit={createAgreement}>
                            <input type="email" placeholder="Party B Email (The other person)" value={partyBEmail} onChange={e => setPartyBEmail(e.target.value)} required disabled={!isActive} />
                            <textarea placeholder="What is the agreement? (e.g., I will deliver the design by Friday)" rows="3" value={text} onChange={e => setText(e.target.value)} required disabled={!isActive} />
                            <button type="submit" disabled={!isActive || submitting} style={{width: '100%', marginTop: '15px'}}>
                                {submitting ? 'Creating...' : (isActive ? 'Create Agreement' : 'Locked')}
                            </button>
                        </form>
                    </div>

                    <div className="card">
                        <div style={{display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '20px'}}>
                            <h3 style={{margin: 0}}>Your Agreements</h3>
                            <button onClick={fetchAgreements} style={{padding: '8px 16px', fontSize: '0.8rem'}}>🔄 Refresh</button>
                        </div>
                        
                        {agreements.map(a => (
                            <div key={a.id} className={`certificate-box ${a.status === 'sealed' ? 'sealed' : a.status === 'denied' ? 'denied' : 'pending'}`}>
                                <div className="watermark">SHANNON</div>
                                <div className="cert-content">
                                    <span className={`seal ${a.status === 'sealed' ? 'sealed' : a.status === 'denied' ? 'denied' : 'pending'}`}>
                                        {a.status === 'sealed' ? '🛡️ Shannon Certified' : a.status === 'denied' ? '❌ Denied by Party B' : '⏳ Pending Signature'}
                                    </span>
                                    <p><strong>To:</strong> {a.party_b_wallet}</p>
                                    <p><strong>Agreement:</strong> {a.agreement_text}</p>
                                    
                                    {a.status === 'pending' && (
                                        <div style={{background: 'var(--dark)', padding: '15px', borderRadius: '8px', marginTop: '15px', border: '1px solid var(--warning)'}}>
                                            <p style={{margin: '0 0 10px 0', fontSize: '0.9rem', color: 'var(--muted)'}}>Send this secure link to Party B:</p>
                                            <div style={{display: 'flex', gap: '10px'}}>
                                                <button onClick={() => sendWhatsApp(a.id)} style={{flex: 1, background: '#25D366', color: 'white'}}>WhatsApp</button>
                                                <button onClick={() => copyLink(a.id)} style={{flex: 1, background: 'var(--primary)', color: 'var(--dark)'}}>Copy Link</button>
                                            </div>
                                        </div>
                                    )}

                                    <p style={{fontSize: '0.85rem', color: '#94a3b8', borderTop: '1px solid var(--border)', paddingTop: '15px', marginTop: '15px'}}>
                                        <strong>Hash:</strong> {a.agreement_hash} | {new Date(a.created_at).toLocaleString()}
                                    </p>
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        // --- PUBLIC PAGES & AUTH ---
        function AuthPage({ onLogin, isSigning, signId }) {
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');
            const [isLogin, setIsLogin] = useState(true);
            const [loading, setLoading] = useState(false);

            const handleAuth = async (e) => {
                e.preventDefault(); setLoading(true);
                if (isLogin) {
                    const { error, data } = await supabase.auth.signInWithPassword({ email, password });
                    if (error) alert(error.message); 
                    else {
                        if (isSigning) window.location.href = `/?sign=${signId}`; // Reload to signing page
                        else onLogin(data.session);
                    }
                } else {
                    const { error } = await supabase.auth.signUp({ email, password });
                    if (error) alert(error.message); 
                    else alert("Account created! You can now log in.");
                }
                setLoading(false);
            };

            return (
                <div className="page-container" style={{display: 'flex', justifyContent: 'center'}}>
                    <div className="card" style={{width: '100%', maxWidth: '450px'}}>
                        <h2 style={{textAlign: 'center'}}>{isLogin ? 'Welcome Back' : 'Join Shannon'}</h2>
                        {isSigning && <p style={{textAlign: 'center', color: 'var(--warning)', marginBottom: '15px'}}>You must log in to view and sign this agreement.</p>}
                        <form onSubmit={handleAuth}>
                            <input type="email" placeholder="Email Address" value={email} onChange={e => setEmail(e.target.value)} required />
                            <input type="password" placeholder="Password" value={password} onChange={e => setPassword(e.target.value)} required />
                            <button type="submit" disabled={loading} style={{marginTop: '20px', width: '100%'}}>{loading ? 'Processing...' : (isLogin ? 'Log In' : 'Sign Up')}</button>
                        </form>
                        <p style={{textAlign: 'center', marginTop: '25px', cursor: 'pointer', color: 'var(--primary)'}} onClick={() => setIsLogin(!isLogin)}>{isLogin ? "Don't have an account? Sign up" : "Already have an account? Log in"}</p>
                    </div>
                </div>
            );
        }

        function HomePage({ navigateTo }) {
            return (
                <div className="page-container">
                    <h1>Stop arguing.<br/><span>Start proving.</span></h1>
                    <p className="hook">"He said it was a partnership. She said it was a favor. Without proof, it's just a broken promise."</p>
                    <div className="card">
                        <h3>The Wild West of Digital Deals</h3>
                        <p>Shannon records the absolute truth of who agreed to what, and exactly when.</p>
                        <button onClick={() => navigateTo('auth')}>Create Record</button>
                    </div>
                </div>
            );
        }

        function AboutPage({ navigateTo }) {
            return (
                <div className="page-container">
                    <h2>The Anatomy of Trust.</h2>
                    <div className="card">
                        <h3>How It Works</h3>
                        <p>1. Party A creates an agreement and sends a secure link.</p>
                        <p>2. Party B logs in (to verify their identity) and clicks Accept.</p>
                        <p>3. The agreement is cryptographically sealed. Party A cannot fake this.</p>
                        <button onClick={() => navigateTo('pricing')}>See Pricing</button>
                    </div>
                </div>
            );
        }

        function PricingPage({ navigateTo }) {
            return (
                <div className="page-container">
                    <h2>Protect your business.</h2>
                    <div className="card" style={{borderColor: 'var(--primary)', textAlign: 'center'}}>
                        <h1 style={{fontSize: '3.5rem', marginBottom: '0'}}>$19.99<span style={{fontSize: '1.2rem', color: 'var(--muted)'}}>/month</span></h1>
                        <div className="wallet-box">{TRUST_WALLET}</div>
                        <button onClick={() => navigateTo('auth')}>I Have Paid - Sign In</button>
                    </div>
                </div>
            );
        }

        function ContactPage() {
            return (
                <div className="page-container">
                    <h2>Contact Us</h2>
                    <div className="card"><p style={{fontSize: '1.5rem', color: 'var(--primary)', fontWeight: 'bold'}}>vision.ktygroup@gmail.com</p></div>
                </div>
            );
        }

        function OwnerPanel() {
            const [users, setUsers] = useState([]);
            useEffect(() => { fetchUsers(); }, []);
            const fetchUsers = async () => {
                const { data } = await supabase.from('users').select('*').order('created_at', { ascending: false });
                if (data) setUsers(data);
            };
            const toggleActive = async (id, currentStatus) => {
                const { error } = await supabase.from('users').update({ is_active: !currentStatus }).eq('id', id);
                if (error) alert(error.message); else fetchUsers();
            };
            return (
                <div className="page-container">
                    <h1 style={{color: '#ef4444'}}>Owner Panel</h1>
                    <div className="card">
                        <h3>User Management</h3>
                        {users.map(u => (
                            <div key={u.id} className="user-row">
                                <div><p style={{margin: '0 0 5px 0', fontWeight: 'bold'}}>{u.email}</p></div>
                                <button onClick={() => toggleActive(u.id, u.is_active)} className={u.is_active ? "btn-success toggle-btn" : "btn-danger toggle-btn"}>
                                    {u.is_active ? "ACTIVE" : "LOCKED"}
                                </button>
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
