<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shannon | The Trust Layer</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        
        :root { 
            --primary: #38bdf8; 
            --dark: #0f172a; 
            --card: #1e293b; 
            --text: #f8fafc; 
            --muted: #94a3b8; 
            --border: #334155; 
            --warning: #eab308; 
            --success: #22c55e; 
            --danger: #ef4444; 
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background: var(--dark); color: var(--text); line-height: 1.6; -webkit-font-smoothing: antialiased; }
        
        nav { display: flex; justify-content: space-between; align-items: center; padding: 16px 24px; background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(8px); position: sticky; top: 0; z-index: 100; border-bottom: 1px solid var(--border); }
        .logo { font-size: 1.25rem; font-weight: 700; color: var(--primary); cursor: pointer; letter-spacing: 1.5px; }
        .gear-icon { font-size: 1.5rem; cursor: pointer; user-select: none; }
        
        .drawer-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.6); z-index: 1000; opacity: 0; pointer-events: none; transition: opacity 0.3s; }
        .drawer-overlay.open { opacity: 1; pointer-events: auto; }
        .drawer { position: fixed; top: 0; right: -280px; width: 280px; height: 100vh; background: var(--card); z-index: 1001; transition: right 0.3s ease; padding: 24px; display: flex; flex-direction: column; gap: 12px; border-left: 1px solid var(--border); }
        .drawer.open { right: 0; }
        .drawer-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; border-bottom: 1px solid var(--border); padding-bottom: 12px; }
        .drawer-header h3 { color: var(--primary); font-size: 1.1rem; }
        .close-btn { cursor: pointer; font-size: 1.2rem; color: var(--muted); }
        .drawer-link { padding: 10px 12px; background: rgba(255,255,255,0.03); border-radius: 6px; cursor: pointer; color: var(--text); font-weight: 500; font-size: 0.95rem; transition: background 0.2s; }
        .drawer-link:hover { background: rgba(56, 189, 248, 0.1); color: var(--primary); }
        
        .page-container { max-width: 800px; margin: 0 auto; padding: 48px 20px; min-height: 80vh; animation: fadeIn 0.4s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        
        h1 { font-size: 2.5rem; font-weight: 700; line-height: 1.2; margin-bottom: 16px; letter-spacing: -0.5px; }
        h1 span { color: var(--primary); }
        h2 { font-size: 1.75rem; margin-bottom: 20px; font-weight: 600; color: var(--text); }
        h3 { font-size: 1.15rem; margin-bottom: 12px; color: var(--primary); font-weight: 600; }
        p { margin-bottom: 16px; color: var(--muted); font-size: 1rem; }
        
        .video-container { position: relative; width: 100%; padding-bottom: 56.25%; border-radius: 12px; overflow: hidden; margin-bottom: 32px; border: 1px solid var(--border); box-shadow: 0 8px 24px rgba(0,0,0,0.2); }
        .video-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }
        
        .card { background: var(--card); border-radius: 12px; padding: 28px; margin-bottom: 24px; border: 1px solid var(--border); }
        
        button { background: var(--primary); color: var(--dark); border: none; padding: 14px 24px; border-radius: 6px; font-weight: 600; font-size: 0.95rem; cursor: pointer; transition: all 0.2s; width: 100%; }
        button:hover { background: #7dd3fc; }
        button:disabled { background: #475569; color: var(--muted); cursor: not-allowed; }
        .btn-danger { background: var(--danger); color: white; }
        .btn-success { background: var(--success); color: white; }
        .btn-outline { background: transparent; border: 1px solid var(--primary); color: var(--primary); }
        .btn-outline:hover { background: rgba(56, 189, 248, 0.1); }
        
        input, textarea { width: 100%; padding: 12px; margin: 8px 0; border-radius: 6px; border: 1px solid var(--border); background: var(--dark); color: white; font-size: 0.95rem; }
        input:focus, textarea:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.1); }
        
        .wallet-box { background: var(--dark); border: 1px dashed var(--primary); padding: 16px; border-radius: 8px; text-align: center; margin: 16px 0; font-family: monospace; font-size: 0.95rem; color: var(--primary); word-break: break-all; }
        
        .user-row { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding: 16px 0; }
        .toggle-btn { padding: 8px 16px; font-size: 0.85rem; width: auto; }
        
        .certificate-box { position: relative; background: var(--dark); border: 1px solid var(--border); border-radius: 10px; padding: 24px; margin-top: 16px; overflow: hidden; }
        .certificate-box.sealed { border-color: var(--success); }
        .certificate-box.pending { border-color: var(--warning); }
        .certificate-box.denied { border-color: var(--danger); }
        .watermark { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) rotate(-20deg); font-size: 5rem; font-weight: 700; color: rgba(255, 255, 255, 0.02); pointer-events: none; z-index: 0; white-space: nowrap; }
        .cert-content { position: relative; z-index: 1; }
        .seal { display: inline-block; padding: 6px 12px; border-radius: 4px; font-size: 0.75rem; font-weight: 700; margin-bottom: 16px; text-transform: uppercase; letter-spacing: 0.5px; }
        .seal.pending { background: var(--warning); color: #000; }
        .seal.sealed { background: var(--success); color: white; }
        .seal.denied { background: var(--danger); color: white; }
        
        .founding-badge { background: var(--warning); color: #000; padding: 4px 12px; border-radius: 20px; font-size: 0.75rem; font-weight: 800; text-transform: uppercase; }
        
        @media (max-width: 768px) {
            h1 { font-size: 2rem; }
            .page-container { padding: 32px 16px; }
            .card { padding: 20px; }
        }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect } = React;
        const SUPABASE_URL = 'https://cpwfezdxdvuctacayjqh.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNwd2ZlemR4ZHZ1Y3RhY2F5anFoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI1OTY4MzgsImV4cCI6MjEwODE3MjgzOH0.2zMpGeU2as25QTpciIe_Ag5jYmVRsu8GdMLN7dajTmc';
        const TRUST_WALLET = '0x5Fc844C3D414d279d5251Ff372601547cB673d28';
        const OWNER_EMAIL = 'vision.ktygroup@gmail.com';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        function App() {
            const [session, setSession] = useState(null);
            const [currentPage, setCurrentPage] = useState('home'); 
            const [menuOpen, setMenuOpen] = useState(false);
            
            const urlParams = new URLSearchParams(window.location.search);
            const signId = urlParams.get('sign');

            useEffect(() => {
                supabase.auth.getSession().then(({ data: { session } }) => {
                    setSession(session); if(session) setCurrentPage('dashboard');
                });
                const { data: { subscription } } = supabase.auth.onAuthStateChange((_event, session) => {
                    setSession(session); if(session) setCurrentPage('dashboard'); else setCurrentPage('home');
                });
                return () => subscription.unsubscribe();
            }, []);

            const handleLogout = async () => { await supabase.auth.signOut(); setCurrentPage('home'); setMenuOpen(false); };
            const navigateTo = (page) => { setCurrentPage(page); setMenuOpen(false); window.scrollTo(0, 0); };

            if (signId) {
                if (!session) return <AuthPage onLogin={setSession} isSigning={true} signId={signId} />;
                return <SigningPage agreementId={signId} session={session} />;
            }

            const renderPage = () => {
                if (session) {
                    if (session.user.email === OWNER_EMAIL) return <OwnerPanel />;
                    return <UserDashboard session={session} />;
                }
                switch(currentPage) {
                    case 'home': return <HomePage navigateTo={navigateTo} />;
                    case 'about': return <AboutPage navigateTo={navigateTo} />;
                    case 'pricing': return <PricingPage navigateTo={navigateTo} />;
                    case 'contact': return <ContactPage />;
                    case 'auth': return <AuthPage onLogin={setSession} />;
                    default: return <HomePage navigateTo={navigateTo} />;
                }
            };

            return (
                <div>
                    <nav>
                        <div className="logo" onClick={() => navigateTo(session ? 'dashboard' : 'home')}>SHANNON</div>
                        <div className="gear-icon" onClick={() => setMenuOpen(true)}>⚙️</div>
                    </nav>
                    <div className={`drawer-overlay ${menuOpen ? 'open' : ''}`} onClick={() => setMenuOpen(false)}></div>
                    <div className={`drawer ${menuOpen ? 'open' : ''}`}>
                        <div className="drawer-header"><h3>Menu</h3><div className="close-btn" onClick={() => setMenuOpen(false)}>✕</div></div>
                        {!session ? (
                            <>
                                <div className="drawer-link" onClick={() => navigateTo('home')}>Home</div>
                                <div className="drawer-link" onClick={() => navigateTo('about')}>About</div>
                                <div className="drawer-link" onClick={() => navigateTo('pricing')}>Pricing</div>
                                <div className="drawer-link" onClick={() => navigateTo('contact')}>Contact</div>
                                <div className="drawer-link" style={{background: 'var(--primary)', color: 'var(--dark)', marginTop: 'auto', textAlign: 'center'}} onClick={() => navigateTo('auth')}>Sign In / Sign Up</div>
                            </>
                        ) : (
                            <>
                                <div className="drawer-link" onClick={() => navigateTo('dashboard')}>My Dashboard</div>
                                <div className="drawer-link" style={{background: '#ef4444', color: 'white', marginTop: 'auto', textAlign: 'center'}} onClick={handleLogout}>Log Out</div>
                            </>
                        )}
                    </div>
                    {renderPage()}
                </div>
            );
        }

        function HomePage({ navigateTo }) {
            return (
                <div className="page-container">
                    <div className="video-container">
                        <iframe 
                            src="https://www.youtube.com/embed/TIJqeIPzWCU?autoplay=0&controls=1" 
                            title="Shannon Demo"
                            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                            allowFullScreen>
                        </iframe>
                    </div>

                    <h1>Stop arguing.<br/><span>Start proving.</span></h1>
                    <p className="hook" style={{borderLeft: '3px solid var(--primary)', paddingLeft: '16px', marginBottom: '32px', fontStyle: 'italic'}}>"He said it was a partnership. She said it was a favor. Without proof, it's just a broken promise."</p>
                    
                    <div className="card">
                        <h3>The Wild West of Digital Deals</h3>
                        <p>Shannon records the absolute truth of who agreed to what, and exactly when. No more screenshots. No more broken promises.</p>
                        <div style={{display: 'flex', gap: '12px', marginTop: '20px'}}>
                            <button onClick={() => navigateTo('auth')}>Create Record</button>
                            <button className="btn-outline" onClick={() => navigateTo('pricing')}>See Pricing</button>
                        </div>
                    </div>
                </div>
            );
        }

        function AboutPage({ navigateTo }) {
            return (
                <div className="page-container">
                    <h2>The Anatomy of Trust.</h2>
                    <div className="card">
                        <h3>How It Works</h3>
                        <p>1. Party A creates an agreement and sends a secure link.</p>
                        <p>2. Party B logs in (to verify their identity) and clicks Accept.</p>
                        <p>3. The agreement is cryptographically sealed. Party A cannot fake this.</p>
                        <button onClick={() => navigateTo('pricing')} style={{marginTop: '20px'}}>See Pricing</button>
                    </div>
                </div>
            );
        }

        function PricingPage({ navigateTo }) {
            const [spotsLeft, setSpotsLeft] = useState(25);
            const [loading, setLoading] = useState(true);

            useEffect(() => {
                const fetchCount = async () => {
                    const { data, error } = await supabase.from('public_active_count').select('active_count').single();
                    if (!error && data) {
                        setSpotsLeft(Math.max(0, 25 - data.active_count));
                    }
                    setLoading(false);
                };
                fetchCount();
            }, []);

            if (loading) return <div className="page-container"><h2>Loading...</h2></div>;

            return (
                <div className="page-container">
                    <h2>Simple, Transparent Pricing.</h2>
                    
                    <div className="card" style={{borderColor: 'var(--primary)'}}>
                        <div style={{textAlign: 'center', marginBottom: '24px'}}>
                            {spotsLeft > 0 ? (
                                <>
                                    <div style={{background: 'var(--warning)', color: '#000', padding: '8px', borderRadius: '6px', fontWeight: '800', marginBottom: '16px', fontSize: '1rem', display: 'inline-block'}}>
                                        ⚠️ Founding Member Offer: Only {spotsLeft} out of 25 spots left!
                                    </div>
                                    <h1 style={{fontSize: '3rem', marginBottom: '8px'}}>$19.99<span style={{fontSize: '1rem', color: 'var(--muted)'}}>/month</span></h1>
                                    <p style={{fontSize: '0.95rem'}}>Lock in this price forever as one of our first 25 users.</p>
                                </>
                            ) : (
                                <>
                                    <h1 style={{fontSize: '3rem', marginBottom: '8px'}}>$49.99<span style={{fontSize: '1rem', color: 'var(--muted)'}}>/month</span></h1>
                                    <p style={{fontSize: '0.95rem'}}>The Founding Member spots are gone. Standard pricing applies.</p>
                                </>
                            )}
                        </div>

                        <div style={{background: 'var(--dark)', padding: '20px', borderRadius: '8px', marginBottom: '24px'}}>
                            <h3 style={{marginBottom: '16px'}}>What you get:</h3>
                            <ul style={{listStyle: 'none', padding: 0, margin: 0, color: 'var(--text)'}}>
                                <li style={{marginBottom: '8px'}}>✅ Unlimited cryptographic agreements</li>
                                <li style={{marginBottom: '8px'}}>✅ Secure two-party login verification</li>
                                <li style={{marginBottom: '8px'}}>✅ Permanent, immutable digital seals</li>
                                <li>✅ WhatsApp & Link sharing</li>
                            </ul>
                        </div>

                        <div style={{textAlign: 'center'}}>
                            <p style={{marginBottom: '12px', fontWeight: '600', color: 'var(--text)'}}>Send USDT (TRC-20) to activate:</p>
                            <div className="wallet-box">{TRUST_WALLET}</div>
                            <button onClick={() => navigateTo('auth')} style={{marginTop: '16px'}}>I Have Paid - Sign In</button>
                            <p style={{fontSize: '0.8rem', color: 'var(--muted)', marginTop: '12px'}}>After payment, your account will be activated manually by the owner.</p>
                        </div>
                    </div>
                </div>
            );
        }

        function ContactPage() {
            return (
                <div className="page-container">
                    <h2>Contact Us</h2>
                    <div className="card">
                        <p style={{fontSize: '1.1rem', color: 'var(--primary)', fontWeight: '500'}}>vision.ktygroup@gmail.com</p>
                    </div>
                </div>
            );
        }

        function AuthPage({ onLogin, isSigning, signId }) {
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');
            const [isLogin, setIsLogin] = useState(true);
            const [loading, setLoading] = useState(false);

            const handleAuth = async (e) => {
                e.preventDefault(); setLoading(true);
                if (isLogin) {
                    const { error, data } = await supabase.auth.signInWithPassword({ email, password });
                    if (error) alert(error.message); 
                    else {
                        if (isSigning) window.location.href = `/?sign=${signId}`; 
                        else onLogin(data.session);
                    }
                } else {
                    const { error } = await supabase.auth.signUp({ email, password });
                    if (error) alert(error.message); 
                    else alert("Account created! You can now log in.");
                }
                setLoading(false);
            };

            return (
                <div className="page-container" style={{display: 'flex', justifyContent: 'center'}}>
                    <div className="card" style={{width: '100%', maxWidth: '400px'}}>
                        <h3 style={{textAlign: 'center', marginBottom: '20px'}}>{isLogin ? 'Welcome Back' : 'Join Shannon'}</h3>
                        {isSigning && <p style={{textAlign: 'center', color: 'var(--warning)', marginBottom: '16px', fontSize: '0.9rem'}}>Log in to view and sign this agreement.</p>}
                        <form onSubmit={handleAuth}>
                            <input type="email" placeholder="Email Address" value={email} onChange={e => setEmail(e.target.value)} required />
                            <input type="password" placeholder="Password" value={password} onChange={e => setPassword(e.target.value)} required />
                            <button type="submit" disabled={loading} style={{marginTop: '16px'}}>{loading ? 'Processing...' : (isLogin ? 'Log In' : 'Sign Up')}</button>
                        </form>
                        <p style={{textAlign: 'center', marginTop: '20px', cursor: 'pointer', color: 'var(--primary)', fontSize: '0.9rem'}} onClick={() => setIsLogin(!isLogin)}>{isLogin ? "Don't have an account? Sign up" : "Already have an account? Log in"}</p>
                    </div>
                </div>
            );
        }

        function UserDashboard({ session }) {
            const [isActive, setIsActive] = useState(false);
            const [agreements, setAgreements] = useState([]);
            const [partyBEmail, setPartyBEmail] = useState('');
            const [text, setText] = useState('');
            const [submitting, setSubmitting] = useState(false);
            const [isFoundingMember, setIsFoundingMember] = useState(false);

            useEffect(() => {
                fetchUserStatus(); fetchAgreements();
            }, []);

            useEffect(() => {
                const interval = setInterval(() => { fetchAgreements(); }, 5000);
                return () => clearInterval(interval);
            }, []);

            const fetchUserStatus = async () => {
                const { data } = await supabase.from('users').select('is_active').eq('id', session.user.id).single();
                if (data) {
                    setIsActive(data.is_active);
                    if (data.is_active) {
                        const { data: countData } = await supabase.from('public_active_count').select('active_count').single();
                        if (countData && countData.active_count <= 25) {
                            setIsFoundingMember(true);
                        }
                    }
                }
            };

            const fetchAgreements = async () => {
                const { data } = await supabase.from('agreements').select('*').eq('created_by', session.user.id).order('created_at', { ascending: false });
                if (data) setAgreements(data);
            };

            const createAgreement = async (e) => {
                e.preventDefault();
                if (!isActive) return alert("Your account is not active.");
                setSubmitting(true);
                
                const hash = btoa(text + Date.now()).substring(0, 16);
                const newId = crypto.randomUUID();

                const { error } = await supabase.from('agreements').insert({
                    id: newId,
                    party_a_wallet: session.user.email, 
                    party_b_wallet: partyBEmail, 
                    agreement_text: text,
                    agreement_hash: hash,
                    created_by: session.user.id,
                    status: 'pending',
                    party_b_status: 'pending'
                });

                if (error) alert(error.message);
                else { setText(''); setPartyBEmail(''); fetchAgreements(); }
                setSubmitting(false);
            };

            const sendWhatsApp = (id) => {
                const link = `${window.location.origin}/?sign=${id}`;
                const message = `Hi, I have sent you an agreement to sign on Shannon. Please click this secure link to review and accept: ${link}`;
                window.open(`https://wa.me/?text=${encodeURIComponent(message)}`, '_blank');
            };

            const copyLink = (id) => {
                navigator.clipboard.writeText(`${window.location.origin}/?sign=${id}`);
                alert("Link copied!");
            };

            return (
                <div className="page-container">
                    <div style={{display: 'flex', alignItems: 'center', gap: '12px', marginBottom: '24px'}}>
                        <h2 style={{margin: 0}}>Dashboard</h2>
                        {isFoundingMember && (
                            <span className="founding-badge">⭐ Founding Member</span>
                        )}
                    </div>
                    
                    <div className="card">
                        <h3>Subscription Status</h3>
                        {isActive ? (
                            <p style={{color: 'var(--success)', fontWeight: '600'}}>✅ Active - Your trust layer is online.</p>
                        ) : (
                            <div>
                                <p style={{color: 'var(--danger)', fontWeight: '600'}}>🔒 Inactive - Payment Required.</p>
                                <p>Send <strong>$19.99/Month</strong> to:</p>
                                <div className="wallet-box">{TRUST_WALLET}</div>
                            </div>
                        )}
                    </div>

                    <div className="card">
                        <h3>Create New Agreement</h3>
                        <form onSubmit={createAgreement}>
                            <input type="email" placeholder="Party B Email (The other person)" value={partyBEmail} onChange={e => setPartyBEmail(e.target.value)} required disabled={!isActive} />
                            <textarea placeholder="What is the agreement?" rows="3" value={text} onChange={e => setText(e.target.value)} required disabled={!isActive} />
                            <button type="submit" disabled={!isActive || submitting} style={{marginTop: '12px'}}>
                                {submitting ? 'Creating...' : (isActive ? 'Create Agreement' : 'Locked')}
                            </button>
                        </form>
                    </div>

                    <div className="card">
                        <div style={{display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '16px'}}>
                            <h3 style={{margin: 0}}>Your Agreements</h3>
                            <button onClick={fetchAgreements} style={{padding: '6px 12px', fontSize: '0.8rem', width: 'auto'}}>🔄 Refresh</button>
                        </div>
                        
                        {agreements.map(a => (
                            <div key={a.id} className={`certificate-box ${a.status === 'sealed' ? 'sealed' : a.status === 'denied' ? 'denied' : 'pending'}`}>
                                <div className="watermark">SHANNON</div>
                                <div className="cert-content">
                                    <span className={`seal ${a.status === 'sealed' ? 'sealed' : a.status === 'denied' ? 'denied' : 'pending'}`}>
                                        {a.status === 'sealed' ? '🛡️ Certified' : a.status === 'denied' ? '❌ Denied' : '⏳ Pending'}
                                    </span>
                                    <p><strong>To:</strong> {a.party_b_wallet}</p>
                                    <p style={{color: 'var(--text)'}}>{a.agreement_text}</p>
                                    
                                    {a.status === 'pending' && (
                                        <div style={{background: 'rgba(255,255,255,0.05)', padding: '12px', borderRadius: '8px', marginTop: '12px', border: '1px solid var(--border)'}}>
                                            <p style={{margin: '0 0 8px 0', fontSize: '0.85rem'}}>Send link to Party B:</p>
                                            <div style={{display: 'flex', gap: '8px'}}>
                                                <button onClick={() => sendWhatsApp(a.id)} style={{flex: 1, background: '#25D366', color: 'white', padding: '10px', fontSize: '0.85rem'}}>WhatsApp</button>
                                                <button onClick={() => copyLink(a.id)} style={{flex: 1, background: 'var(--primary)', color: 'var(--dark)', padding: '10px', fontSize: '0.85rem'}}>Copy Link</button>
                                            </div>
                                        </div>
                                    )}

                                    <p style={{fontSize: '0.75rem', color: 'var(--muted)', borderTop: '1px solid var(--border)', paddingTop: '12px', marginTop: '12px'}}>
                                        Hash: {a.agreement_hash} | {new Date(a.created_at).toLocaleString()}
                                    </p>
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        function SigningPage({ agreementId, session }) {
            const [agreement, setAgreement] = useState(null);
            const [loading, setLoading] = useState(true);
            const [error, setError] = useState('');

            useEffect(() => { fetchAgreement(); }, [agreementId]);

            const fetchAgreement = async () => {
                const { data, error } = await supabase.from('agreements').select('*').eq('id', agreementId).single();
                if (error || !data) {
                    setError('Agreement not found.');
                } else {
                    if (data.party_b_wallet.toLowerCase() !== session.user.email.toLowerCase()) {
                        setError(`Access Denied. This agreement was sent to a different email address.`);
                    } else {
                        setAgreement(data);
                    }
                }
                setLoading(false);
            };

            const handleSign = async (decision) => {
                const { error } = await supabase.from('agreements')
                    .update({ party_b_status: decision, status: decision === 'accepted' ? 'sealed' : 'denied' })
                    .eq('id', agreement.id);
                
                if (error) alert("Error: " + error.message);
                else {
                    setAgreement({ ...agreement, party_b_status: decision, status: decision === 'accepted' ? 'sealed' : 'denied' });
                }
            };

            if (loading) return <div className="page-container"><h2>Loading...</h2></div>;
            if (error) return <div className="page-container"><h2 style={{color: 'var(--danger)'}}>{error}</h2></div>;

            return (
                <div className="page-container">
                    <h2>Review Agreement</h2>
                    <div className={`certificate-box ${agreement.status === 'sealed' ? 'sealed' : agreement.status === 'denied' ? 'denied' : 'pending'}`}>
                        <div className="watermark">SHANNON</div>
                        <div className="cert-content">
                            <span className={`seal ${agreement.status === 'sealed' ? 'sealed' : agreement.status === 'denied' ? 'denied' : 'pending'}`}>
                                {agreement.status === 'sealed' ? '🛡️ Sealed' : agreement.status === 'denied' ? '❌ Denied' : '⏳ Pending'}
                            </span>
                            <p><strong>From:</strong> {agreement.party_a_wallet}</p>
                            <p style={{color: 'var(--text)'}}>{agreement.agreement_text}</p>
                            
                            {agreement.status === 'pending' && (
                                <div style={{display: 'flex', gap: '10px', marginTop: '16px'}}>
                                    <button onClick={() => handleSign('accepted')} className="btn-success" style={{flex: 1}}>Accept & Sign</button>
                                    <button onClick={() => handleSign('denied')} className="btn-danger" style={{flex: 1}}>Deny</button>
                                </div>
                            )}
                            
                            {agreement.status === 'sealed' && <p style={{color: 'var(--success)', fontWeight: '600', marginTop: '16px'}}>Signed successfully. Party A has been notified.</p>}
                            {agreement.status === 'denied' && <p style={{color: 'var(--danger)', fontWeight: '600', marginTop: '16px'}}>You have rejected this agreement.</p>}
                            
                            <p style={{fontSize: '0.75rem', color: 'var(--muted)', borderTop: '1px solid var(--border)', paddingTop: '12px', marginTop: '16px'}}>
                                Hash: {agreement.agreement_hash}
                            </p>
                        </div>
                    </div>
                </div>
            );
        }

        function OwnerPanel() {
            const [users, setUsers] = useState([]);
            useEffect(() => { fetchUsers(); }, []);
            const fetchUsers = async () => {
                const { data } = await supabase.from('users').select('*').order('created_at', { ascending: false });
                if (data) setUsers(data);
            };
            const toggleActive = async (id, currentStatus) => {
                const { error } = await supabase.from('users').update({ is_active: !currentStatus }).eq('id', id);
                if (error) alert(error.message); else fetchUsers();
            };
            return (
                <div className="page-container">
                    <h2 style={{color: 'var(--danger)', marginBottom: '24px'}}>Owner Panel</h2>
                    <div className="card">
                        <h3>User Management</h3>
                        {users.map(u => (
                            <div key={u.id} className="user-row">
                                <div>
                                    <p style={{margin: 0, fontWeight: '600', fontSize: '0.95rem', color: 'var(--text)'}}>{u.email}</p>
                                </div>
                                <button onClick={() => toggleActive(u.id, u.is_active)} className={`toggle-btn ${u.is_active ? 'btn-success' : 'btn-danger'}`}>
                                    {u.is_active ? "ACTIVE" : "LOCKED"}
                                </button>
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
